name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      # Both jobs publish to the same GitHub Release for the tag. Run them
      # sequentially so the second finds the release the first created,
      # instead of both racing to create it.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3's prebuilt binaries don't cover every Node 20.x
          # patch version, which forces a from-source compile that fails on
          # GitHub's Windows runners (node-gyp can't locate a usable Visual
          # Studio install there). Node 22 has full prebuild coverage.
          node-version: 22
      - run: npm ci
      - run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
